const glyphCache = {};
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function glyph(ch, col) {
  const k = ch + col;
  if (glyphCache[k]) return glyphCache[k];
  const rows = FONT[ch] || FONT['?'];
  const c = mkCanvas(5, 7), g = c.getContext('2d');
  g.fillStyle = col;
  for (let y = 0; y < 7; y++) for (let x = 0; x < 5; x++) if (rows[y] & (16 >> x)) g.fillRect(x, y, 1, 1);
  return (glyphCache[k] = c);
}
function normTxt(s) {
  return String(s).toUpperCase()
    .replace(/[ÁÀÄÂ]/g, 'A').replace(/[ÉÈËÊ]/g, 'E').replace(/[ÍÌÏÎ]/g, 'I')
    .replace(/[ÓÒÖÔ]/g, 'O').replace(/[ÚÙÜÛ]/g, 'U');
}
function textW(s, sc = 1) { return normTxt(s).length * 6 * sc - sc; }
function drawText(s, x, y, col = '#fcfcfc', sc = 1, align = 'left', shadow = null) {
  s = normTxt(s);
  const w = s.length * 6 * sc - sc;
  if (align === 'center') x -= w / 2; else if (align === 'right') x -= w;
  x = Math.round(x); y = Math.round(y);
  for (const ch of s) {
    if (ch !== ' ') {
      if (shadow) ctx.drawImage(glyph(ch, shadow), x + sc, y + sc, 5 * sc, 7 * sc);
      ctx.drawImage(glyph(ch, col), x, y, 5 * sc, 7 * sc);
    }
    x += 6 * sc;
  }
}
function wrap(s, max) {
  const words = s.split(' '); const lines = []; let cur = '';
  for (const w of words) {
    if ((cur + (cur ? ' ' : '') + w).length > max) { lines.push(cur); cur = w; }
    else cur += (cur ? ' ' : '') + w;
  }
  if (cur) lines.push(cur);
  return lines;
}

function spr(rows, pal) {
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const c = mkCanvas(w, h), g = c.getContext('2d');
  for (let y = 0; y < h; y++) {
    const r = rows[y];
    for (let x = 0; x < r.length; x++) { const col = pal[r[x]]; if (col) { g.fillStyle = col; g.fillRect(x, y, 1, 1); } }
  }
  const l = mkCanvas(w, h), gl = l.getContext('2d');
  gl.translate(w, 0); gl.scale(-1, 1); gl.drawImage(c, 0, 0);
  return { r: c, l, w, h };
}
// orig=true dibuja la orientación original del sprite
function drawSpr(s, x, y, orig = true, flipV = false, sc = 1) {
  const img = orig ? s.r : s.l;
  x = Math.round(x); y = Math.round(y);
  if (!flipV) { ctx.drawImage(img, x, y, s.w * sc, s.h * sc); return; }
  ctx.save(); ctx.translate(x, y + s.h * sc); ctx.scale(1, -1);
  ctx.drawImage(img, 0, 0, s.w * sc, s.h * sc); ctx.restore();
}

function tileCanvas(fn, w = 16, h = 16) { const c = mkCanvas(w, h); fn(c.getContext('2d')); return c; }
function R(g, c, x, y, w, h) { g.fillStyle = c; g.fillRect(x, y, w, h); }
function brickTile(base, light, mortar) {
  return tileCanvas(g => {
    R(g, base, 0, 0, 16, 16); R(g, light, 0, 0, 16, 1);
    [3, 7, 11, 15].forEach(y => R(g, mortar, 0, y, 16, 1));

    R(g, mortar, 7, 8, 1, 3); R(g, mortar, 15, 8, 1, 3);

  { s:() => SPR.neuron[0], n:'NEURONAS', d:'JUNTA 100 PARA UNA VIDA EXTRA.' },
  { s:() => SPR.heart, n:'RED DE APOYO', d:'UNA VIDA EXTRA.' },
];

// ================== ESTADO ==================
let state = 'title', page = 0, titleT = 0, cardT = 0, goT = 0, deathT = 0;
let score = 0, coins = 0, lives = 3, time = 300, timeTick = 24, checkpoint = 0;
let LG = [], ents = [], fx = [], texts = [], bumps = [], blockCount = {};
let player = null, cam = 0, frame = 0, freeze = 0, winSeq = null, banner = null;
const seen = new Set();
const SOLID = new Set(['#','B','?','M','S','U','N','X','[',']','{','}','C','H','=','u']);

function solidAt(px, py) {
  const tx = Math.floor(px / T), ty = Math.floor(py / T);
  if (tx < 0 || tx >= LW) return true;
  if (ty < 0 || ty >= LH) return false;
  return SOLID.has(LG[ty][tx]);
}
function tileAt(px, py) {
  const tx = Math.floor(px / T), ty = Math.floor(py / T);
  if (tx < 0 || tx >= LW || ty < 0 || ty >= LH) return ' ';
  return LG[ty][tx];
}
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const isEnemy = e => e.t === 'ghost' || e.t === 'dragon' || e.t === 'bat';
const isStomp = (p, e) => p.vy > 0 && (p.y + p.h - p.vy) <= e.y + 6;

// ================== NIVEL 1-1 ==================
const CLOUDS = [[8,2,1],[19,1,1],[27,2,3],[36,1,2],[56,2,1],[67,1,1],[75,2,3],[84,1,2],[104,2,1],[115,1,1],[123,2,3],[132,1,2],[152,2,1]];
const HILLS = [[0,1],[16,0],[48,1],[64,0],[96,1],[112,0],[144,1]];
const BUSHES = [[11,3],[23,1],[41,2],[59,3],[73,1],[89,2],[107,3],[119,1],[137,2],[157,1]];

function makeEnt(t, tx, ty) {
  const e = { t, active: false, dead: false, vx: 0, vy: 0, onGround: false, x: tx * T, y: ty * T, w: 16, h: 16 };
  switch (t) {
    case 'ghost':  e.w = 14; e.h = 15; e.x = tx * T + 1; e.y = (ty + 1) * T - 15; e.vx = -0.5; break;
    case 'dragon': e.w = 14; e.h = 22; e.x = tx * T + 1; e.y = (ty + 1) * T - 22; e.vx = -0.5; e.mode = 'walk'; break;
    case 'bat':    e.w = 14; e.h = 10; e.baseY = ty * T; e.vx = -0.6; e.tt = 0; break;
    case 'toc':    e.cx = tx * T; e.top = ty * T; e.x = e.cx - 8; e.off = 0; e.phase = 'hidden'; e.tt = 0; e.h = 0; break;
    case 'firebar':e.cx = tx * T + 8; e.cy = ty * T + 8; e.ang = Math.PI; break;
    case 'boss':   e.w = 40; e.h = 44; e.y = (ty + 3) * T - 44; e.hp = 5; e.hurtT = 0; e.tt = 0; e.face = -1; e.vx = -0.5;
                   e.minX = 203 * T; e.maxX = 210 * T; break;
    case 'npc':    e.h = 19; e.y = (ty + 1) * T - 19; break;
  }
  return e;
}

function buildLevel() {
  LG = []; for (let y = 0; y < LH; y++) LG.push(new Array(LW).fill(' '));
  ents = []; fx = []; texts = []; bumps = []; blockCount = {};
  const S = (x, y, c) => { if (x >= 0 && x < LW && y >= 0 && y < LH) LG[y][x] = c; };
  const ground = (a, b, c = '#') => { for (let x = a; x <= b; x++) { S(x, 13, c); S(x, 14, c); } };
  const row = (x, y, s) => { for (let i = 0; i < s.length; i++) if (s[i] !== ' ') S(x + i, y, s[i]); };
  const pipe = (x, h) => { const t = 13 - h; S(x, t, '['); S(x + 1, t, ']'); for (let y = t + 1; y < 13; y++) { S(x, y, '{'); S(x + 1, y, '}'); } return t; };
  const stairUp = (x, n) => { for (let i = 0; i < n; i++) for (let j = 0; j <= i; j++) S(x + i, 12 - j, 'X'); };
  const stairDown = (x, n) => { for (let i = 0; i < n; i++) for (let j = 0; j < n - i; j++) S(x + i, 12 - j, 'X'); };
  const E = (t, x, y) => ents.push(makeEnt(t, x, y));

  // --- Exterior ---
  ground(0, 68); ground(71, 85); ground(89, 152); ground(155, 169);
  row(16, 9, '?');
  row(20, 9, 'BMB?B'); row(22, 5, '?');
  E('ghost', 22, 12);
  pipe(28, 2); pipe(38, 3); const t46 = pipe(46, 4); pipe(57, 4);
  row(32, 8, 'ooo');
  E('toc', 47, t46);
  E('ghost', 42, 12); E('ghost', 51, 12); E('ghost', 53, 12);
  row(64, 8, 'U');
  row(69, 9, 'oo');
  row(77, 9, 'BMB'); row(80, 5, 'BBBBBBBB');
  E('ghost', 81, 4); E('ghost', 83, 4);
  row(91, 5, 'BBB?'); row(94, 9, 'N');
  E('ghost', 97, 12); E('ghost', 99, 12);
  row(100, 9, 'BS');
  row(106, 9, '?'); row(109, 9, '?'); row(112, 9, '?'); row(109, 5, 'M');
  E('dragon', 107, 12); E('bat', 103, 6);
  row(118, 9, 'B'); row(121, 5, 'BBB');
  E('ghost', 114, 12); E('ghost', 116, 12);
  row(128, 5, 'B??B'); row(129, 9, 'BB');
  E('ghost', 124, 12); E('ghost', 126, 12);
  E('bat', 132, 5);
  stairUp(134, 4); stairDown(140, 4);
  row(144, 8, 'ooo');
  stairUp(148, 4); for (let j = 0; j < 4; j++) S(152, 12 - j, 'X');
  stairDown(155, 4);
  pipe(161, 2);
  E('dragon', 166, 12);

  // --- Castillo ---
  for (let x = CASTLE_X; x < LW; x++) { S(x, 0, 'C'); S(x, 1, 'C'); }
  ground(170, 180, 'C');
  for (let x = 181; x <= 183; x++) { S(x, 13, 'L'); S(x, 14, 'L'); }
  ground(184, 191, 'C');
  for (let x = 192; x <= 212; x++) { S(x, 13, 'L'); S(x, 14, 'L'); }
  for (let x = 195; x <= 200; x++) for (let y = 10; y <= 14; y++) S(x, y, 'C');
  for (let x = 201; x <= 212; x++) S(x, 10, '=');
  for (let x = 213; x <= 216; x++) for (let y = 10; y <= 14; y++) S(x, y, 'C');
  S(176, 9, 'H'); E('firebar', 176, 9);
  row(187, 9, 'M');
  E('ghost', 189, 12);
  S(197, 7, 'H'); E('firebar', 197, 7);
  E('boss', 208, 7);
  E('key', 213, 9);
  E('npc', 215, 9);
}

// ================== JUGADOR ==================
function newPlayer(x, y) {
  return { x, y, w: 12, h: 15, vx: 0, vy: 0, face: 1, onGround: false, big: false, fire: false, inv: 0, star: 0,
           anim: 0, skid: false, dead: false, chain: 0, kickGrace: 0, growAnim: 0, growType: '' };
}

function collideX(e) {
  const ys = []; for (let yy = e.y + 1; yy < e.y + e.h - 1; yy += 8) ys.push(yy); ys.push(e.y + e.h - 1);
  if (e.vx > 0) { const rx = e.x + e.w; for (const yy of ys) if (solidAt(rx, yy)) { e.x = Math.floor(rx / T) * T - e.w; return true; } }
  else if (e.vx < 0) { const lx = e.x; for (const yy of ys) if (solidAt(lx, yy)) { e.x = Math.floor(lx / T) * T + T; return true; } }
  return false;
}
function collideY(e) {
  e.onGround = false;
  if (e.vy >= 0) {
    const by = e.y + e.h;
    if (solidAt(e.x + 1, by) || solidAt(e.x + e.w - 1, by) || (e.w > 20 && solidAt(e.x + e.w / 2, by))) {
      e.y = Math.floor(by / T) * T - e.h; e.vy = 0; e.onGround = true; return 'down';
    }
  } else {
    const ty = e.y;
    if (solidAt(e.x + 1, ty) || solidAt(e.x + e.w - 1, ty)) { e.y = Math.floor(ty / T) * T + T; e.vy = 0; return 'up'; }
  }
  return null;
}
function playerCollideY(p) {
  p.onGround = false;
  if (p.vy >= 0) {
    const by = p.y + p.h;
    if (solidAt(p.x + 1, by) || solidAt(p.x + p.w - 1, by)) { p.y = Math.floor(by / T) * T - p.h; p.vy = 0; p.onGround = true; }
    return;
  }
  const ty = p.y;
  const L = solidAt(p.x + 1, ty), Rr = solidAt(p.x + p.w - 1, ty);
  if (!L && !Rr) return;
  // deslizar en esquinas
  if (L && !Rr) { const edge = (Math.floor((p.x + 1) / T) + 1) * T; if (edge - p.x <= 5) { p.x = edge; return; } }
  if (Rr && !L) { const edge = Math.floor((p.x + p.w - 1) / T) * T; if (p.x + p.w - edge <= 5) { p.x = edge - p.w; return; } }
  const row = Math.floor(ty / T);
  p.y = (row + 1) * T; p.vy = 1;
  let tx;
  const lt = Math.floor((p.x + 1) / T), rt = Math.floor((p.x + p.w - 1) / T);
  if (L && Rr) { const c = p.x + p.w / 2; tx = Math.abs(c - (lt * T + 8)) <= Math.abs(c - (rt * T + 8)) ? lt : rt; }
  else tx = L ? lt : rt;
  if (row >= 0) hitBlock(tx, row);
}

function updatePlayer() {
  const p = player;
  const maxS = I.run ? 2.5 : 1.5, acc = I.run ? 0.07 : 0.05;
  p.skid = false;
  if (p.onGround) {
    if (I.left && !I.right) { if (p.vx > 0) { p.vx -= 0.2; p.skid = true; } else p.vx = Math.max(-maxS, p.vx - acc); p.face = -1; }
    else if (I.right && !I.left) { if (p.vx < 0) { p.vx += 0.2; p.skid = true; } else p.vx = Math.min(maxS, p.vx + acc); p.face = 1; }
    else { if (p.vx > 0) p.vx = Math.max(0, p.vx - 0.06); else if (p.vx < 0) p.vx = Math.min(0, p.vx + 0.06); }
    if (Math.abs(p.vx) > maxS) p.vx -= Math.sign(p.vx) * 0.04;
  } else {
    const cap = Math.max(maxS, Math.abs(p.vx));
    if (I.left && !I.right) p.vx = Math.max(-cap, p.vx - acc * 0.8);
    if (I.right && !I.left) p.vx = Math.min(cap, p.vx + acc * 0.8);
  }
  if (I.jumpP && p.onGround) {
    p.vy = -(3.9 + Math.min(Math.abs(p.vx), 2.5) * 0.28); p.onGround = false;
    sfx(p.big ? 'jumpBig' : 'jump');
  }
  p.vy = Math.min(p.vy + ((I.jump && p.vy < 0) ? 0.12 : 0.42), 4.5);

  p.x += p.vx; if (collideX(p)) p.vx = 0;
  if (p.x < cam) { p.x = cam; if (p.vx < 0) p.vx = 0; }
  p.y += p.vy; playerCollideY(p);
  if (p.onGround) { p.chain = 0; p.anim += Math.abs(p.vx) * 0.12; }

  // lanzar burbujas de diálogo
  if (p.fire && I.runP && ents.filter(e => e.t === 'bubble').length < 2) {
    ents.push({ t: 'bubble', active: true, dead: false, x: p.face > 0 ? p.x + p.w : p.x - 8, y: p.y + 6, w: 8, h: 8,
                vx: p.face * 3.6, vy: 1.5, life: 200 });
    sfx('bubble');
  }
  if (p.inv > 0) p.inv--;
  if (p.star > 0) p.star--;
  if (p.kickGrace > 0) p.kickGrace--;

  // monedas (neuronas) sueltas
  for (let yy = Math.floor(p.y / T); yy <= Math.floor((p.y + p.h - 1) / T); yy++)
    for (let xx = Math.floor(p.x / T); xx <= Math.floor((p.x + p.w - 1) / T); xx++)
      if (yy >= 0 && yy < LH && xx >= 0 && xx < LW && LG[yy][xx] === 'o') { LG[yy][xx] = ' '; collectCoin(); }

  // lava y vacío
  if (tileAt(p.x + 2, p.y + p.h - 4) === 'L' || tileAt(p.x + p.w - 2, p.y + p.h - 4) === 'L') { killPlayer(true); return; }
  if (p.y > LH * T + 8) { killPlayer(true); return; }

  // puntos de control
  if (p.x > 90 * T && checkpoint < 1) checkpoint = 1;
  if (p.x > 171 * T && checkpoint < 2) checkpoint = 2;

  // llave del alta
  const key = ents.find(e => e.t === 'key');
  if (key && overlap(p, key)) startWin(key);
}

function hurtPlayer() {
  const p = player;
  if (p.inv > 0 || p.star > 0 || p.dead || freeze > 0) return;
  if (p.big) {
    p.big = false; p.fire = false; p.y += 12; p.h = 15; p.inv = 120;
    p.growAnim = 48; p.growType = 'shrink'; freeze = 48; sfx('shrink'); rumble(0.6, 0.3, 220);
  } else killPlayer(false);
}
function killPlayer(pit) {
  const p = player; if (p.dead) return;
  p.dead = true; p.pit = pit; p.vx = 0; p.vy = 0;
  if (p.big) { p.y += 12; } p.big = false; p.fire = false; p.h = 15; p.star = 0;
  deathT = 0; state = 'dying'; stopMusic(); sfx('die'); rumble(1, 1, 450);
}
function powerUp(kind, e) {
  const p = player;
  showBanner(kind);
  if (kind === 'heart') { oneUp(e.x, e.y); return; }
  addScore(1000, e.x, e.y);
  if (kind === 'lotus') { p.star = 620; sfx('power'); return; }
  if (!p.big) { p.big = true; p.y -= 12; p.h = 27; p.growAnim = 48; p.growType = 'grow'; freeze = 48; sfx('power'); }
  else if (kind === 'bulb' && !p.fire) { p.fire = true; p.growAnim = 40; p.growType = 'fire'; freeze = 40; sfx('power'); }
  else sfx('power');
}

// ================== PUNTUACIÓN Y EFECTOS ==================
function addScore(n, x, y, name) { score += n; texts.push({ x: x + 8, y, s: String(n), name, t: 0 }); }
function oneUp(x, y) { lives++; sfx('oneup'); texts.push({ x: x + 8, y, s: '1UP', t: 0 }); }
function collectCoin() {
  coins++; score += 200; sfx('coin');
  if (coins >= 100) { coins -= 100; oneUp(player.x, player.y - 8); }
}
function chainScore(e, holder) {
  const tbl = [100, 200, 400, 500, 800, 1000, 2000, 4000, 5000, 8000];
  const i = holder.chain || 0; holder.chain = i + 1;
  if (i >= tbl.length) { oneUp(e.x, e.y); return; }
  addScore(tbl[i], e.x, e.y, NAMES[e.t]);
}
function showBanner(k) {
  if (!BANNERS[k] || seen.has(k)) return;
  seen.add(k); banner = { lines: BANNERS[k], t: 260 }; sfx('banner');
}
function poof(x, y) { fx.push({ k: 'poof', x, y, t: 0 }); }
function killFlip(e, dir) { e.flip = true; e.vy = -3.5; e.vx = (dir || 1) * 0.8; sfx('kick'); }
function coinPop(tx, ty) { fx.push({ k: 'coin', x: tx * T + 2, y: ty * T - 14, vy: -5, t: 0 }); collectCoin(); }
function breakFx(tx, ty) {
  [[-1, -5], [1, -5], [-1, -3], [1, -3]].forEach(([vx, vy], i) =>
    fx.push({ k: 'deb', x: tx * T + (i % 2) * 8 + 2, y: ty * T + (i < 2 ? 0 : 8), vx, vy }));
}
function spawnItem(kind, tx, ty) {
  ents.push({ t: kind, active: true, dead: false, x: tx * T + 1, y: ty * T, w: 14, h: 15, vx: 0, vy: 0, emerge: 16 });
  sfx('sprout');
}
function hitBlock(tx, ty) {
  const c = LG[ty][tx], p = player;
  let bumped = true;
  if (c === '?') { LG[ty][tx] = 'u'; coinPop(tx, ty); }
  else if (c === 'N') {
    const k = ty * LW + tx; blockCount[k] = (blockCount[k] === undefined ? 8 : blockCount[k]) - 1;
    coinPop(tx, ty); if (blockCount[k] <= 0) LG[ty][tx] = 'u';
  }
  else if (c === 'M') { LG[ty][tx] = 'u'; spawnItem(p.big ? 'bulb' : 'book', tx, ty); }
  else if (c === 'U') { LG[ty][tx] = 'u'; spawnItem('heart', tx, ty); }
  else if (c === 'S') { LG[ty][tx] = 'u'; spawnItem('lotus', tx, ty); }
  else if (c === 'B') {
    if (p.big) { LG[ty][tx] = ' '; breakFx(tx, ty); score += 50; sfx('brk'); rumble(0.2, 0.5, 90); bumped = false; }
    else sfx('bump');
  } else { sfx('bump'); return; }
  if (bumped) bumps.push({ x: tx, y: ty, t: 0 });
  for (const e of ents) {
    if (isEnemy(e) && e.active && !e.flip && !e.squash && e.x + e.w > tx * T && e.x < tx * T + T && Math.abs(e.y + e.h - ty * T) < 4) {
      killFlip(e, e.x + e.w / 2 < tx * T + 8 ? -1 : 1); addScore(100, e.x, e.y, NAMES[e.t]);
    }
  }
}

// ================== ENTIDADES ==================
function walker(e) {
  e.vy = Math.min(e.vy + 0.25, 4);
  e.x += e.vx; if (collideX(e)) e.vx = -e.vx;
  e.y += e.vy; collideY(e);
  if (e.y > LH * T + 32) e.dead = true;
}
function flipFall(e) { e.vy += 0.3; e.y += e.vy; e.x += e.vx; if (e.y > H + 40) e.dead = true; }
function bounceOff() { player.vy = I.jump ? -5.2 : -3.5; }

function updateEnt(e) {
  const p = player;
  const touching = !p.dead && overlap(p, e);
  switch (e.t) {
    case 'ghost':
      if (e.squash) { if (--e.squash <= 0) e.dead = true; return; }
      if (e.flip) { flipFall(e); return; }
      walker(e);
      if (touching) {
        if (p.star) { killFlip(e, p.x < e.x ? 1 : -1); chainScore(e, p); }
        else if (isStomp(p, e)) { e.squash = 30; sfx('stomp'); bounceOff(); chainScore(e, p); }
        else hurtPlayer();
      }
      return;
    case 'dragon':
      if (e.flip) { flipFall(e); return; }
      if (e.mode === 'walk') {
        walker(e);
        if (touching) {
          if (p.star) { killFlip(e, p.x < e.x ? 1 : -1); chainScore(e, p); }
          else if (isStomp(p, e)) { e.mode = 'shell'; e.vx = 0; e.h = 14; e.y += 8; e.revive = 420; sfx('stomp'); bounceOff(); chainScore(e, p); }
          else hurtPlayer();
        }
      } else if (e.mode === 'shell') {
        walker(e); e.vx = 0;
        if (--e.revive <= 0) { e.mode = 'walk'; e.h = 22; e.y -= 8; e.vx = p.x < e.x ? -0.5 : 0.5; }
        if (touching) {
          if (p.star) { killFlip(e, 1); chainScore(e, p); return; }
          const dir = (p.x + p.w / 2 < e.x + e.w / 2) ? 1 : -1;
          e.mode = 'slide'; e.vx = 3.6 * dir; e.chain = 0; p.kickGrace = 14; sfx('kick');
          if (isStomp(p, e)) bounceOff();
          addScore(400, e.x, e.y);
        }
      } else if (e.mode === 'slide') {
        walker(e);
        for (const o of ents) {
          if (o !== e && isEnemy(o) && o.active && !o.flip && !o.squash && overlap(e, o)) { killFlip(o, Math.sign(e.vx)); chainScore(o, e); }
        }
        if (e.x < cam - 64 || e.x > cam + W + 64) e.dead = true;
        if (touching) {
          if (p.star) { killFlip(e, 1); chainScore(e, p); }
          else if (isStomp(p, e)) { e.mode = 'shell'; e.vx = 0; e.revive = 420; sfx('stomp'); bounceOff(); }
          else if (p.kickGrace <= 0) hurtPlayer();
        }
      }
      return;
    case 'bat':
      if (e.flip) { flipFall(e); return; }
      e.tt++; e.x += e.vx; e.y = e.baseY + Math.sin(e.tt * 0.06) * 20;
      if (touching) {
        if (p.star) { killFlip(e, 1); chainScore(e, p); }
        else if (isStomp(p, e)) { killFlip(e, 0); sfx('stomp'); bounceOff(); chainScore(e, p); }
        else hurtPlayer();
      }
      return;
    case 'toc': {
      e.tt++;
      const near = Math.abs(p.x + p.w / 2 - e.cx) < 30;
      if (e.phase === 'hidden') { if (e.tt > 100 && !near) { e.phase = 'up'; e.tt = 0; } }
      else if (e.phase === 'up') { e.off = Math.min(24, e.off + 0.75); if (e.off >= 24) { e.phase = 'out'; e.tt = 0; } }
      else if (e.phase === 'out') { if (e.tt > 90) { e.phase = 'down'; e.tt = 0; } }
      else if (e.phase === 'down') { e.off = Math.max(0, e.off - 0.75); if (e.off <= 0) { e.phase = 'hidden'; e.tt = 0; } }
      e.x = e.cx - 6; e.w = 12; e.y = e.top - e.off + 3; e.h = Math.max(0, e.off - 3);
      if (e.h > 2 && !p.dead && overlap(p, e)) {
        if (p.star) { e.dead = true; poof(e.cx - 8, e.y); addScore(200, e.cx - 8, e.y, NAMES.toc); sfx('kick'); }
        else hurtPlayer();
      }
      return;
    }
    case 'firebar':
      e.ang += 0.032;
      if (p.dead || p.star) return;
      for (let i = 1; i <= 5; i++) {
        const ox = e.cx + Math.cos(e.ang) * i * 8, oy = e.cy + Math.sin(e.ang) * i * 8;
        if (ox + 3 > p.x && ox - 3 < p.x + p.w && oy + 3 > p.y && oy - 3 < p.y + p.h) { hurtPlayer(); break; }
      }
      return;
    case 'boss': updateBoss(e, touching); return;
    case 'flame':
      e.x += e.vx;

      }
      if (touching && e.emerge < 8) { e.dead = true; powerUp(e.t, e); }
      return;
  }
}

function bossHit(e) {
  e.hp--; e.hurtT = 60; sfx('bossHit'); rumble(0.8, 0.5, 250);

}
function updateBoss(e, touching) {

  if (!e.started) { if (e.x < cam + W - 24) { e.started = true; playMusic('boss'); } else return; }
  e.tt++; if (e.hurtT > 0) e.hurtT--;

  if (e.tt % 80 === 0) e.vx = Math.random() < 0.5 ? -0.5 : 0.5;
  e.x += e.vx;
  if (e.x < e.minX) { e.x = e.minX; e.vx = 0.5; }
  if (e.x > e.maxX) { e.x = e.maxX; e.vx = -0.5; }
  e.vy = Math.min(e.vy + 0.2, 4); e.y += e.vy; collideY(e);

    const ty = Math.max(10 * T - 44, Math.min(10 * T - 10, p.y + p.h - 14));
    ents.push({ t: 'flame', active: true, dead: false, x: e.face < 0 ? e.x - 22 : e.x + e.w, y: e.y + 10, w: 22, h: 6, vx: e.face * 1.5, ty, face: e.face });

}

function disc(cx, cy, r, col) {

    const L = [['¡GRACIAS, DOCTOR(A)!', '#7cfc9c'], ['LA DEPRESION MAYOR FUE SUPERADA.', '#fcfcfc'],
               ['TU PACIENTE HA SIDO DADO DE ALTA.', '#fcfcfc'], ['', ''],
               ['RECUERDA: LOS TRASTORNOS MENTALES', '#fcd838'], ['SON TRATABLES. PEDIR AYUDA', '#fcd838'],
               ['ES UN ACTO DE VALENTIA.', '#fcd838']];
    const n = Math.min(L.length, Math.floor(winSeq.t / 18) + (winSeq.phase === 'done' ? 99 : 0));
    for (let i = 0; i < n; i++) drawText(L[i][0], 128, 48 + i * 11, L[i][1], 1, 'center', '#000');
    if (winSeq.phase === 'done') {
      drawText('NIVEL DE PRUEBA COMPLETADO', 128, 136, '#c8a0fc', 1, 'center', '#000');
      if ((frame >> 5) & 1) drawText(pressTxt(), 128, 150, '#fcfcfc', 1, 'center', '#000');
    }
  }
}
function drawTitle() {
  ctx.fillStyle = '#5c94fc'; ctx.fillRect(0, 0, W, H);
  hill(-10, true); hill(170, false);
  puff(10, 18, 1, '#fcfcfc', '#000'); puff(190, 10, 2, '#fcfcfc', '#000');
  puff(150, 13 * T - 21, 2, '#80d010', '#000');
  for (let x = 0; x < 16; x++) { ctx.drawImage(TILE.ground, x * T, 13 * T); ctx.drawImage(TILE.ground, x * T, 14 * T); }
  // placa del título
  ctx.fillStyle = '#000'; ctx.fillRect(26, 30, 208, 70);
  ctx.fillStyle = '#c84c0c'; ctx.fillRect(24, 28, 208, 70);
  ctx.fillStyle = '#fcbcb0'; ctx.fillRect(24, 28, 208, 1); ctx.fillRect(24, 28, 1, 70);
  [[27,31],[228,31],[27,94],[228,94]].forEach(([x, y]) => { ctx.fillStyle = '#000'; ctx.fillRect(x, y, 2, 2); });
  drawText('PSICO', 128, 36, '#fcbcb0', 4, 'center', '#000');
  drawText('BROS.', 128, 66, '#fcbcb0', 4, 'center', '#000');
  drawText('TERAPIA CONTRA LOS TRASTORNOS DEL DSM-5', 128, 106, '#fcfcfc', 1, 'center', '#000');
  if ((titleT >> 5) & 1 || titleT < 20) drawText(pressTxt(), 128, 124, '#fcd838', 1, 'center', '#000');
  drawText('FLECHAS: MOVER   ESPACIO: SALTAR', 128, 142, '#fcfcfc', 1, 'center', '#000');
  drawText('SHIFT / X: CORRER Y LANZAR', 128, 152, '#fcfcfc', 1, 'center', '#000');
  drawText('P: PAUSA  M: SONIDO  F: PANTALLA', 128, 162, '#fcfcfc', 1, 'center', '#000');
  drawSpr(SPR.player.norm.small[(titleT >> 3) & 1 ? 'walk1' : 'walk2'], 40, 13 * T - 16);
  const gx = 230 - ((titleT * 0.5) % 120);
  drawSpr(SPR.ghost[(titleT >> 3) & 1], gx, 13 * T - 16);
  drawSpr(SPR.dragon[(titleT >> 3) & 1], gx + 26, 13 * T - 24);
  drawText('UN JUEGO EDUCATIVO DE SALUD MENTAL', 128, 230, '#fcfcfc', 1, 'center', '#000');
  const pi = padInfo();
  if (pi) {
    drawText('CONTROL ' + pi.name + ' DETECTADO', 128, 174, '#7cfc9c', 1, 'center', '#000');
    let l = pi.jump + ': SALTAR  ' + pi.run + ': CORRER  ' + pi.start + ': PAUSA';
    if (l.length > 40) l = pi.jump + ': SALTAR   ' + pi.run + ': CORRER';
    drawText(l, 128, 184, '#fcfcfc', 1, 'center', '#000');
    if (!muted && (!AC || AC.state !== 'running')) drawText('HAZ CLIC PARA ACTIVAR EL SONIDO', 128, 16, '#fcd838', 1, 'center', '#000');
  } else if ((titleT >> 6) & 1) {
    drawText('¿TIENES CONTROL? CONECTALO Y PULSA', 128, 174, '#c8d8fc', 1, 'center', '#000');
    drawText('CUALQUIER BOTON PARA DETECTARLO', 128, 184, '#c8d8fc', 1, 'center', '#000');
  }
}
function pressTxt() { const pi = padInfo(); return pi ? 'PRESIONA ENTER O ' + pi.jump : 'PRESIONA ENTER'; }
function drawList(title, items, rowH) {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  drawText(title, 128, 8, '#fcd838', 1, 'center');
  ctx.fillStyle = '#fcd838'; ctx.fillRect(16, 17, 224, 1);
  let y = 24;
  for (const it of items) {
    const s = it.s();
    const sx = 18 - Math.floor(s.w / 2) + 8, sy = y + Math.max(0, Math.floor((24 - s.h) / 2));
    drawSpr(s, sx, sy);
    drawText(it.n, 38, y, '#fcd838');
    wrap(it.d, 35).forEach((l, i) => drawText(l, 38, y + 9 + i * 8, '#fcfcfc'));
    y += rowH;
  }
  return y;
}
function drawBestiary() {
  if (page === 0) {
    drawList('EXPEDIENTE CLINICO: TRASTORNOS (DSM-5)', BESTIARY, 33);
  } else {
    let y = drawList('HERRAMIENTAS TERAPEUTICAS', TOOLS, 27);
    y += 2;
    drawText('PISA A LOS TRASTORNOS O USA BURBUJAS', 128, y, '#7cfc9c', 1, 'center');
    drawText('DE DIALOGO. ¡LLEGA A LA LLAVE DEL ALTA!', 128, y + 10, '#7cfc9c', 1, 'center');
  }
  if ((frame >> 5) & 1) drawText(padInfo() ? 'ENTER / ' + padInfo().jump + ': CONTINUAR' : 'ENTER: CONTINUAR', 128, 230, '#a0a0a0', 1, 'center');
}
function drawCard() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  drawHUD();
  drawText('MUNDO 1-1', 128, 78, '#fcfcfc', 1, 'center');
  drawText('CONSULTA 1: LA MENTE INQUIETA', 128, 94, '#fcd838', 1, 'center');
  drawSpr(SPR.player.norm.small.stand, 100, 112);
  drawText('×  ' + lives, 124, 117, '#fcfcfc');
  drawText(['', 'PUNTO DE CONTROL: MITAD DEL CAMINO', 'PUNTO DE CONTROL: EL CASTILLO'][checkpoint], 128, 150, '#a0a0a0', 1, 'center');
  drawText('NIVEL DE PRUEBA', 128, 200, '#606060', 1, 'center');
}
function drawGameOver() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  drawHUD();
  drawText('FIN DEL JUEGO', 128, 86, '#fc4870', 2, 'center');
  drawText('LA TERAPIA ES UN PROCESO.', 128, 120, '#fcfcfc', 1, 'center');
  drawText('¡NO TE RINDAS!', 128, 132, '#fcd838', 1, 'center');
  if (goT > 90 && (frame >> 5) & 1) drawText(pressTxt(), 128, 170, '#a0a0a0', 1, 'center');
}
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  switch (state) {
    case 'title': drawTitle(); break;
    case 'bestiary': drawBestiary(); break;
    case 'card': drawCard(); break;
    case 'gameover': drawGameOver(); break;
    default:
      drawWorld(); drawHUD();
      if (state === 'pause') {
        ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, W, H);
        drawText('PAUSA', 128, 100, '#fcfcfc', 2, 'center', '#000');
        drawText((padInfo() ? padInfo().start + ' / ' : '') + 'P / ENTER PARA CONTINUAR', 128, 124, '#fcfcfc', 1, 'center', '#000');
      }
  }
  if (toast) {
    drawBox(18, 204, 220, 28);
    drawText(toast.title, 128, 209, toast.col, 1, 'center');
    drawText(toast.sub, 128, 220, '#fcfcfc', 1, 'center');
  }
}

// ================== BUCLE PRINCIPAL (60 pasos/seg fijos) ==================
const STEP = 1000 / 60;
let last = performance.now(), acc = 0;
function loop(now) {
  requestAnimationFrame(loop);
  let dt = now - last; last = now;
  if (dt > 250) dt = 250;
  acc += dt;
  pollGamepad();
  let n = 0;
  while (acc >= STEP) {
    readInput(); update();
    for (const k in pk) delete pk[k];
    acc -= STEP;
    if (++n > 5) { acc = 0; break; }
  }
  render();
  musicTick();
}
// Ganchos para pruebas automáticas
window.__psico = { get state() { return state; }, get player() { return player; }, get cam() { return cam; },
  get ents() { return ents; }, start(cp) { newGame(); checkpoint = cp || 0; } };
requestAnimationFrame(loop);
})();
</script>
